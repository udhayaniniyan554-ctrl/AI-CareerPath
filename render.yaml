services:
  - type: web
    name: ai-careerpath
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
